# Weekly update pull requests, grouped so each ecosystem opens one at a time.
# A version must be a week old first: a freshly published one may be a
# compromised or broken release that is pulled within days.
version: 2
updates:
  - package-ecosystem: npm
    # The second folder pins the Tauri CLI the Release workflow's signing job installs
    # alone (see .github/updater-signer). One group, so both move in one pull request:
    # scripts/updater-signer.test.mjs fails while they differ.
    directories:
      - /
      - /.github/updater-signer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
