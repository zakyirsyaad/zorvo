name: Release

# Builds the macOS app for a version tag (v1.2.3) and keeps the DMG and the update
# package as the workflow artifact `release-build`. That is all it does: it holds no
# secret but the optional Apple ones and publishes nothing.
#
# Every installed Zorvo trusts one updater key (its public half is in tauri.conf.json)
# and installs whatever it signs, so whoever can read the private key can push an update
# to all of them. This job runs the project's own dependencies (Vite, every crate's
# build.rs, all dev-dependency code), so the key, its password and the token that
# publishes to the releases repository stay out of GitHub altogether. When the run is
# green, `node scripts/sign-release.mjs vX.Y.Z` runs on the maintainer's Mac, from a
# clean checkout of the tag: it downloads the artifact, checks it, signs the update
# package with the key there, makes the draft release, and uploads the DMG (also as
# Zorvo-mac.dmg, the name the site's Download link uses), SHA256SUMS.txt, the package,
# its signature and latest.json. Publishing the draft is the last step, by hand.
#
# With the Apple secrets set (see docs/development.md, "Releasing"), the app is signed and notarized;
# without them it is signed ad-hoc under the bundle identifier (`bundle.macOS.signingIdentity` is "-"),
# which is not notarized. Only tags trigger it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple Silicon and Intel)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag that does not match the app would build a whole universal release under the
      # wrong version, and leave stale assets in the draft when it is run again. Failing
      # here costs seconds instead of the build's macOS minutes.
      - name: Check the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::The tag $TAG must be vMAJOR.MINOR.PATCH, or vMAJOR.MINOR.PATCH-rc.1 for a pre-release."
            exit 1
          fi
          version="${TAG#v}"
          cargo_version=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/^[^"]*"|".*$/,""); print; exit}' src-tauri/Cargo.toml)
          status=0
          for entry in "package.json|$(jq -r '.version // ""' package.json)" "src-tauri/tauri.conf.json|$(jq -r '.version // ""' src-tauri/tauri.conf.json)" "src-tauri/Cargo.toml|$cargo_version"; do
            file="${entry%%|*}"
            found="${entry#*|}"
            if [ "$found" != "$version" ]; then
              echo "::error file=$file::$file says \"$found\" but the tag is $TAG. Bump package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json, then tag again."
              status=1
            fi
          done
          exit $status
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # scripts/sign-release.mjs writes the release notes from this section, after the build. A tag
      # whose version has none would fail there, so it fails here, in seconds, instead.
      - name: Check the changelog has a section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/public-docs.mjs notes CHANGELOG.md "$TAG" > /dev/null
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # A secret that is not set still expands to an empty variable, which the
      # bundler would take as "sign with this". Export only the ones that exist.
      - name: Use the Apple signing secrets that are set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
            fi
          done
      # `tauri build` refuses to run while update packages are on (createUpdaterArtifacts) and no
      # signing key is set, and `--no-sign` would also skip the Apple code signing. So the build is
      # given a key made here, for this run only. It signs a package nobody uses: the real key
      # never leaves the maintainer's Mac, where scripts/sign-release.mjs signs the package again.
      - name: Make a one-off key, so the build runs without the real one
        run: pnpm tauri signer generate --ci --write-keys "$RUNNER_TEMP/one-off.key"
      # Builds only: with no tagName the action uploads nothing, and no token is given to it. It
      # also sets TAURI_BUNDLER_DMG_IGNORE_CI, which the DMG needs on a runner.
      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Not a secret: the public address of the Zorvo Credits server, compiled into the app
          # (`private_mode::CREDITS_BASE_URL`). Without it Private mode would ask 127.0.0.1.
          ZORVO_CREDITS_URL: https://zorvo-credits-server.zkyxentertain.workers.dev
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/one-off.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target universal-apple-darwin
      # The names scripts/sign-release.mjs expects, made from the tag. It takes nothing else from the
      # artifact, since this job runs code it does not control.
      - name: Collect the DMG and the update package
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          package=$(jq -r '.[] | select(endswith(".app.tar.gz"))' <<<"$ARTIFACTS" | head -n 1)
          dmg=$(jq -r '.[] | select(endswith(".dmg"))' <<<"$ARTIFACTS" | head -n 1)
          if [ -z "$package" ]; then
            echo "::error::The build made no .app.tar.gz update package."
            exit 1
          fi
          if [ -z "$dmg" ]; then
            echo "::error::The build made no DMG."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-build"
          cp "$package" "$RUNNER_TEMP/release-build/Zorvo_${version}_universal.app.tar.gz"
          cp "$dmg" "$RUNNER_TEMP/release-build/Zorvo_${version}_universal.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build/
          if-no-files-found: error
          # "Re-run all jobs" builds again; the name must not be taken by the first attempt's artifact.
          overwrite: true
          # Long enough to sign a release when it suits you; the files are the DMG and the package.
          retention-days: 30
          compression-level: 0
