name: Release

# Builds the macOS app for a version tag (v1.2.3) and attaches it to a draft
# release in the public zakyirsyaad/zorvo-releases repository, since this one
# is private and its releases cannot be downloaded. It also uploads the DMG as
# Zorvo-mac.dmg, the stable name the site's Download link uses, adds
# SHA256SUMS.txt, writes the notes from the version's changelog section, and
# copies docs/releases-repo/ (the user guide, issue templates, security policy)
# and the released part of CHANGELOG.md there (scripts/public-docs.mjs).
#
# Needs the RELEASES_TOKEN secret: a fine-grained token with Contents read and
# write on zorvo-releases only. It also needs TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, the updater key that signs the update
# package (its public half is in tauri.conf.json); the release adds latest.json,
# the .app.tar.gz and its .sig, which installed copies of Zorvo update from.
# With the Apple secrets set (see README, "Releasing"), the app is signed and
# notarized; without them it is built unsigned. Only tags trigger it: the
# release is named after the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASES_REPO: zakyirsyaad/zorvo-releases

jobs:
  macos:
    name: macOS (Apple Silicon and Intel)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check the releases token is set
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Set the RELEASES_TOKEN secret: a fine-grained token with Contents read and write on $RELEASES_REPO."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag that does not match the app would build a whole universal release under the
      # wrong version, and leave stale assets in the draft when it is run again. Failing
      # here costs seconds instead of the build's macOS minutes.
      - name: Check the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::The tag $TAG must be vMAJOR.MINOR.PATCH, or vMAJOR.MINOR.PATCH-rc.1 for a pre-release."
            exit 1
          fi
          version="${TAG#v}"
          cargo_version=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/^[^"]*"|".*$/,""); print; exit}' src-tauri/Cargo.toml)
          status=0
          for entry in "package.json|$(jq -r '.version // ""' package.json)" "src-tauri/tauri.conf.json|$(jq -r '.version // ""' src-tauri/tauri.conf.json)" "src-tauri/Cargo.toml|$cargo_version"; do
            file="${entry%%|*}"
            found="${entry#*|}"
            if [ "$found" != "$version" ]; then
              echo "::error file=$file::$file says \"$found\" but the tag is $TAG. Bump package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json, then tag again."
              status=1
            fi
          done
          exit $status
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The updater key signs every update, and installed copies accept only the key whose
      # public half is in tauri.conf.json. The Tauri CLI merely warns when the two differ and
      # reports a wrong password after the whole universal build, so a bad key would publish
      # updates no installed Zorvo accepts. A probe signed here, with the key and password the
      # build will use, fails in seconds instead.
      - name: Check the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/check-updater-signing.mjs key src-tauri/tauri.conf.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # A secret that is not set still expands to an empty variable, which the
      # bundler would take as "sign with this". Export only the ones that exist.
      - name: Use the Apple signing secrets that are set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
            fi
          done
      # The release's notes are the version's section of the public changelog.
      - name: Write the release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            node scripts/public-docs.mjs notes CHANGELOG.md "$TAG"
            echo
            echo "Download **Zorvo-mac.dmg** (Apple Silicon and Intel). See the [user guide](https://github.com/$RELEASES_REPO#install) to install it, and SHA256SUMS.txt to check the download."
          } > "$RUNNER_TEMP/notes.md"
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "body<<$delimiter"; cat "$RUNNER_TEMP/notes.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Signs the update package; tauri-action uploads it as .app.tar.gz.sig
          # and writes latest.json (uploadUpdaterJson is on by default).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: zakyirsyaad
          repo: zorvo-releases
          # The tag is made in zorvo-releases, whose history does not have this commit.
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: Zorvo ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          # A tag with a pre-release part (v0.7.0-rc.1) must never become the "latest" release
          # that installed copies read their updates from.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target universal-apple-darwin
      # What installed copies of Zorvo will read once the draft is published. The universal
      # build must be offered to both Macs (the updater looks up darwin-aarch64 or
      # darwin-x86_64, so a latest.json without either leaves that Mac on its old version
      # with no error). Every entry must download from this releases repository, be signed
      # by the key in tauri.conf.json, and record the version being released, which a client
      # with requireSignedVersion compares with the version latest.json announces.
      - name: Check latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p "$RUNNER_TEMP/updater"
          gh release download "$TAG" --repo "$RELEASES_REPO" --pattern latest.json --dir "$RUNNER_TEMP/updater" --clobber
          package=$(jq -r '.[] | select(endswith(".app.tar.gz"))' <<<"$ARTIFACTS" | head -n 1)
          if [ -z "$package" ]; then
            echo "::error::The build made no .app.tar.gz update package."
            exit 1
          fi
          # Installed copies ask the repository named in plugins.updater.endpoints, and accept a download only from
          # the one in ALLOWED_DOWNLOADS (src-tauri/src/app_update.rs; a unit test ties that list to the endpoint).
          # This workflow publishes to RELEASES_REPO: if the three drift apart, no installed Zorvo would update.
          if ! jq -e --arg repo "$RELEASES_REPO" '($repo | ascii_downcase) as $r | .plugins.updater.endpoints | (length > 0) and all(.[]; ascii_downcase | startswith("https://github.com/" + $r + "/"))' src-tauri/tauri.conf.json >/dev/null; then
            echo "::error::plugins.updater.endpoints in src-tauri/tauri.conf.json is not inside https://github.com/$RELEASES_REPO, where this workflow publishes."
            exit 1
          fi
          # The same places the app accepts a download from.
          if ! jq -e --arg repo "$RELEASES_REPO" '($repo | ascii_downcase) as $r | (.platforms | to_entries) | (length > 0) and all(.[]; ((.value.url // "") | ascii_downcase) as $url | ($url | startswith("https://api.github.com/repos/" + $r + "/")) or ($url | startswith("https://github.com/" + $r + "/")))' "$RUNNER_TEMP/updater/latest.json" >/dev/null; then
            echo "::error::A download URL in latest.json is not inside https://github.com/$RELEASES_REPO, so installed copies of Zorvo would refuse it."
            exit 1
          fi
          node scripts/check-updater-signing.mjs manifest src-tauri/tauri.conf.json "$RUNNER_TEMP/updater/latest.json" "$TAG" "$package"
      # The site links to releases/latest/download/Zorvo-mac.dmg, so every
      # release also carries its DMG under that one name.
      - name: Upload the DMG under its stable name
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          TAG: ${{ github.ref_name }}
        run: |
          dmg=$(jq -r '.[] | select(endswith(".dmg"))' <<<"$ARTIFACTS" | head -n 1)
          if [ -z "$dmg" ]; then
            echo "::error::The build made no DMG."
            exit 1
          fi
          cp "$dmg" "$RUNNER_TEMP/Zorvo-mac.dmg"
          gh release upload "$TAG" "$RUNNER_TEMP/Zorvo-mac.dmg" --repo "$RELEASES_REPO" --clobber
      # Lets anyone check a download: shasum -a 256 -c SHA256SUMS.txt. Only the DMGs: the
      # update package is uploaded under another name than the bundler gives it, and it is
      # protected by its signature.
      - name: Upload the checksums
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/sums"
          cp "$RUNNER_TEMP/Zorvo-mac.dmg" "$RUNNER_TEMP/sums/"
          jq -r '.[] | select(endswith(".dmg"))' <<<"$ARTIFACTS" | while read -r file; do
            cp "$file" "$RUNNER_TEMP/sums/"
          done
          (cd "$RUNNER_TEMP/sums" && shasum -a 256 -- * > ../SHA256SUMS.txt)
          gh release upload "$TAG" "$RUNNER_TEMP/SHA256SUMS.txt" --repo "$RELEASES_REPO" --clobber
      - name: Copy the user guide and changelog to the releases repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Everything under docs/releases-repo/ goes to the same path there. The
          # public changelog has no Unreleased section and no links into this
          # private repository.
          node scripts/public-docs.mjs changelog CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
          pairs=("$RUNNER_TEMP/CHANGELOG.md:CHANGELOG.md")
          while IFS= read -r file; do
            pairs+=("$file:${file#docs/releases-repo/}")
          done < <(find docs/releases-repo -type f | sort)
          for pair in "${pairs[@]}"; do
            src="${pair%%:*}"
            dest="${pair##*:}"
            # Unchanged files are skipped, so the history shows only real updates.
            # The API's sha is the git blob hash, so comparing it is exact for
            # any file, the icon included.
            sha=$(gh api "repos/$RELEASES_REPO/contents/$dest" --jq .sha 2>/dev/null || true)
            if [ -n "$sha" ] && [ "$sha" = "$(git hash-object "$src")" ]; then
              continue
            fi
            args=(-f message="docs: update $dest for $TAG" -f content="$(base64 < "$src" | tr -d '\n')" -f branch=main)
            if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
            gh api --method PUT "repos/$RELEASES_REPO/contents/$dest" "${args[@]}" --silent
          done
