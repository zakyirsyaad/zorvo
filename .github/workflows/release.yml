name: Release

# Builds the macOS app for a version tag (v1.2.3) and attaches it to a draft
# release in the public zakyirsyaad/zorvo-releases repository, since this one
# is private and its releases cannot be downloaded. It also uploads the DMG as
# Zorvo-mac.dmg, the stable name the site's Download link uses, and copies the
# user guide (docs/releases-repo/README.md) and CHANGELOG.md there.
#
# Needs the RELEASES_TOKEN secret: a fine-grained token with Contents read and
# write on zorvo-releases only. With the Apple secrets set (see README,
# "Releasing"), the app is signed and notarized; without them it is built
# unsigned. Only tags trigger it: the release is named after the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASES_REPO: zakyirsyaad/zorvo-releases

jobs:
  macos:
    name: macOS (Apple Silicon and Intel)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check the releases token is set
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Set the RELEASES_TOKEN secret: a fine-grained token with Contents read and write on $RELEASES_REPO."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # A secret that is not set still expands to an empty variable, which the
      # bundler would take as "sign with this". Export only the ones that exist.
      - name: Use the Apple signing secrets that are set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
            fi
          done
      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        with:
          owner: zakyirsyaad
          repo: zorvo-releases
          # The tag is made in zorvo-releases, whose history does not have this commit.
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: Zorvo ${{ github.ref_name }}
          releaseBody: See the README for requirements, and for opening an unsigned build (System Settings → Privacy & Security → Open Anyway).
          releaseDraft: true
          args: --target universal-apple-darwin
      # The site links to releases/latest/download/Zorvo-mac.dmg, so every
      # release also carries its DMG under that one name.
      - name: Upload the DMG under its stable name
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          TAG: ${{ github.ref_name }}
        run: |
          dmg=$(jq -r '.[] | select(endswith(".dmg"))' <<<"$ARTIFACTS" | head -n 1)
          if [ -z "$dmg" ]; then
            echo "::error::The build made no DMG."
            exit 1
          fi
          cp "$dmg" "$RUNNER_TEMP/Zorvo-mac.dmg"
          gh release upload "$TAG" "$RUNNER_TEMP/Zorvo-mac.dmg" --repo "$RELEASES_REPO" --clobber
      - name: Copy the user guide and changelog to the releases repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          for pair in "docs/releases-repo/README.md:README.md" "CHANGELOG.md:CHANGELOG.md"; do
            src="${pair%%:*}"
            dest="${pair##*:}"
            sha=$(gh api "repos/$RELEASES_REPO/contents/$dest" --jq .sha 2>/dev/null || true)
            args=(-f message="docs: update $dest for $TAG" -f content="$(base64 < "$src" | tr -d '\n')" -f branch=main)
            if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
            gh api --method PUT "repos/$RELEASES_REPO/contents/$dest" "${args[@]}" --silent
          done
