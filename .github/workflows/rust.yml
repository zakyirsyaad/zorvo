name: Rust

# The Rust job needs a macOS runner, which a private repository pays for at
# ten times the minutes of a Linux one. It runs on every push to main, and on
# a pull request only when the backend, its build inputs or this file change.
# (A path-filtered workflow reports no status when it is skipped, so it cannot
# be a required check; re-check that if branch protection is turned back on.)
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  # A newer push to a PR supersedes the older run; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust (clippy, test)
    # The app targets macOS; its runner also needs no webkit packages for Tauri.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      # Node runs the fake ACP agent in the tests; the frontend build gives
      # Tauri the dist folder it embeds at compile time.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test
