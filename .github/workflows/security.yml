name: Security

# The dependencies checked against known advisories: on pull requests, on
# main, and weekly so a new advisory for an unchanged lockfile still shows up.
# CodeQL code scanning was removed when the repository went private: on a
# private repository it needs GitHub Code Security. Add it back if the
# repository is made public again.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - name: npm advisories (shipped dependencies)
        run: pnpm audit --prod --audit-level=high
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      - name: RustSec advisories
        working-directory: src-tauri
        run: cargo audit
