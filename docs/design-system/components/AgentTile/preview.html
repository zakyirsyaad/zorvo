<!-- @dsCard group="Status" height=150 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>AgentTile — preview</title></head>
<body>
<div class="z-col" style="gap:var(--space-4)">
  <div class="z-hstack" style="gap:var(--space-4)">
    <span class="z-tile z-tile--16">C</span>
    <span class="z-tile z-tile--22">C</span>
    <span class="z-tile z-tile--28">C</span>
    <span class="z-cap z-subtle">16, 22 and 28 px</span>
  </div>
  <div class="z-hstack" style="gap:var(--space-5)">
    <span class="z-hstack z-ui-sm z-muted"><span class="z-tile z-tile--22">X<span class="z-tile__badge z-tile__badge--attention"></span></span>Waiting for you</span>
    <span class="z-hstack z-ui-sm z-muted"><span class="z-tile z-tile--22">Q<span class="z-tile__badge z-tile__badge--running"></span></span>Working</span>
    <span class="z-hstack z-ui-sm z-muted"><span class="z-tile z-tile--22">G<span class="z-tile__badge z-tile__badge--unread"></span></span>Finished, unread</span>
    <span class="z-hstack z-ui-sm z-muted"><span class="z-tile z-tile--22">C</span>Idle</span>
  </div>
</div>
</body>
</html>
