<!doctype html>
<html>
<head><meta charset="utf-8"><title>Composer — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&amp;display=swap">
<style>
.z-draft-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); width: 100%; max-width: 560px; margin-bottom: var(--space-4); }
.z-dchip { display: inline-flex; align-items: center; gap: var(--space-1\.5); height: 28px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface-1); color: var(--fg-secondary); font: 400 12px/16px var(--font-sans); cursor: pointer; }
.z-dchip:hover { background: var(--surface-hover); color: var(--fg); }
.z-mono { font-family: var(--font-mono); font-size: 11px; }
.z-subtle { color: var(--fg-subtle); }
.z-cchip { display: inline-flex; align-items: center; gap: var(--space-1\.5); height: 28px; box-sizing: border-box; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-md); background: transparent; color: var(--fg-secondary); font: 400 12px/16px var(--font-sans); cursor: pointer; }
.z-cchip:hover, .z-cchip[aria-expanded="true"] { background: var(--surface-hover); color: var(--fg); }
.z-chev { width: 12px; height: 12px; fill: none; stroke: var(--fg-muted); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.z-thumb { position: relative; width: 96px; height: 64px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-3); }
.z-thumb__remove { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border: 0; border-radius: 9999px; background: var(--surface-3); color: var(--fg-secondary); font: 400 10px/18px var(--font-sans); }
.z-meter { margin-right: var(--space-2); color: var(--fg-subtle); font: 400 11px/16px var(--font-sans); }
</style>
</head>
<body>
<div class="z-col">
  <div class="z-draft-chips">
    <button class="z-dchip" type="button">agent-desktop</button>
    <button class="z-dchip" type="button"><span class="z-mono">main</span> <span class="z-subtle">· new worktree</span></button>
    <button class="z-dchip" type="button">Claude Code, Codex <span class="z-subtle">· compare</span></button>
  </div>
  <div class="z-composer">
    <div class="z-thumb" role="img" aria-label="shot.png"><button class="z-thumb__remove" type="button" aria-label="Remove shot.png">×</button></div>
    <textarea id="prompt" rows="2" placeholder="Reply to Claude Code"></textarea>
    <div class="z-composer__bar">
      <div class="z-composer__tools">
        <button class="z-icon-btn" type="button" aria-label="Add attachment"><svg class="z-ico" viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg></button>
        <span class="z-cchip">Claude Code</span>
        <button class="z-cchip" type="button">Opus <svg class="z-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="z-cchip" type="button" aria-expanded="true">Ask before edits <svg class="z-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="z-icon-btn" type="button" aria-label="More options"><svg class="z-ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      </div>
      <div class="z-composer__tools">
        <span class="z-meter">38% of context</span>
        <button class="z-icon-btn z-icon-btn--primary" type="button" aria-label="Send message"><svg class="z-ico" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
