<!-- @dsCard group="Actions" height=130 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton — preview</title></head>
<body>
<div class="z-col" style="gap:var(--space-3)">
  <div class="z-stage" style="padding:0">
    <button class="z-icon-btn z-icon-btn--xs" type="button" aria-label="Dismiss notice"><svg class="z-ico z-ico--sm" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <button class="z-icon-btn z-icon-btn--sm" type="button" aria-label="Stop"><svg class="z-ico z-ico--sm" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
    <button class="z-icon-btn" type="button" aria-label="Attach"><svg class="z-ico" viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg></button>
    <button class="z-icon-btn z-icon-btn--secondary" type="button" aria-label="Show sidebar"><svg class="z-ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
    <button class="z-icon-btn z-icon-btn--secondary" type="button" aria-pressed="true" aria-label="Inspector"><svg class="z-ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg></button>
    <button class="z-icon-btn z-icon-btn--secondary" type="button" aria-expanded="true" aria-label="More"><svg class="z-ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    <button class="z-icon-btn" type="button" aria-label="Copy" disabled><svg class="z-ico" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>
    <button class="z-icon-btn z-icon-btn--primary" type="button" aria-label="Send message"><svg class="z-ico" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
    <button class="z-icon-btn z-icon-btn--outline" type="button" aria-label="Stop"><svg class="z-ico z-ico--sm" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
  </div>
  <span class="z-cap z-subtle">22, 24 and 28 px. Ghost, secondary, open, pressed, disabled, Send, Stop.</span>
</div>
</body>
</html>
