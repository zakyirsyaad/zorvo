<!-- @dsCard group="Chat" height=260 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Message — preview</title>
<style>
.z-chat { display: flex; flex-direction: column; gap: var(--space-3); width: 520px; padding: var(--space-3); box-sizing: border-box; background: var(--bg); font-family: var(--font-sans); }
.z-you { align-self: flex-end; max-width: 85%; padding: var(--space-2) var(--space-3); border-radius: 16px; background: var(--surface-2); color: var(--fg); font: 400 14px/22px var(--font-sans); }
.z-head { display: flex; align-items: center; gap: var(--space-2); }
.z-logo { width: 16px; height: 16px; border-radius: 4px; background: var(--fg-muted); }
.z-name { color: var(--fg-secondary); font: 500 13px/18px var(--font-sans); }
.z-time { color: var(--fg-muted); font: 400 11px/16px var(--font-sans); }
.z-body { margin-top: var(--space-1); color: var(--fg-secondary); font: 400 14px/22px var(--font-sans); }
.z-tools { margin-top: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-md); }
.z-tools__sum { display: flex; justify-content: space-between; padding: var(--space-1) var(--space-3); color: var(--fg-secondary); font: 400 13px/18px var(--font-sans); }
.z-tools__row { display: flex; justify-content: space-between; gap: var(--space-2); padding: var(--space-1) var(--space-3); border-top: 1px solid var(--border); font: 400 13px/18px var(--font-sans); color: var(--fg-secondary); }
.z-target { color: var(--fg-muted); font: 400 12px/16px var(--font-mono); }
.z-muted { color: var(--fg-muted); font: 400 11px/16px var(--font-sans); }
.z-done { color: var(--status-running); font: 400 11px/16px var(--font-sans); }
.z-working { display: flex; align-items: center; gap: var(--space-1\.5); color: var(--fg-muted); font: 400 12px/16px var(--font-sans); }
.z-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--status-running); }
</style>
</head>
<body>
<div class="z-stage">
  <div class="z-chat">
    <div class="z-you">Split the parser in two and keep the tests green.</div>
    <div>
      <div class="z-head"><span class="z-logo" aria-hidden="true"></span><span class="z-name">Claude Code</span><span class="z-time">2 minutes ago</span></div>
      <div class="z-body">I split it into a lexer and a parser.</div>
      <div class="z-tools">
        <div class="z-tools__sum"><span>Edited 2 files, ran a command</span><span class="z-muted">1 still running</span></div>
        <div class="z-tools__row"><span>Edited <span class="z-target">src/lexer.ts</span></span><span class="z-done">Done</span></div>
        <div class="z-tools__row"><span>Ran <span class="z-target">pnpm test</span></span><span class="z-muted">Running</span></div>
      </div>
    </div>
    <div class="z-working"><span class="z-dot" aria-hidden="true"></span>Claude Code is working 45s</div>
  </div>
</div>
</body>
</html>
