<!doctype html>
<html>
<head><meta charset="utf-8"><title>Popover — preview</title></head>
<body>
<div class="z-stage" style="align-items:flex-start; gap:var(--space-5)">
  <div class="z-pop" role="listbox" style="width:260px">
    <div class="z-pop__head">Mode</div>
    <div class="z-pop__item z-pop__item--desc is-picked is-on" role="option" aria-selected="true"><span class="z-pop__slot"><svg class="z-ico z-ico--sm" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="z-pop__label">Ask before edits<span class="z-pop__desc">Asks before it edits a file</span></span></div>
    <div class="z-pop__item z-pop__item--desc" role="option"><span class="z-pop__slot"></span><span class="z-pop__label">Edit automatically<span class="z-pop__desc">Edits files without asking</span></span></div>
    <div class="z-pop__item z-pop__item--desc" role="option"><span class="z-pop__slot"></span><span class="z-pop__label">Bypass permissions <svg class="z-ico z-ico--sm z-att" viewBox="0 0 24 24" style="vertical-align:-2px"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span class="z-pop__desc">Lets the agent act without asking.</span></span></div>
  </div>
  <div class="z-pop" role="dialog" style="width:300px">
    <div class="z-pop__search"><svg class="z-ico z-ico--sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Search branches</div>
    <div class="z-pop__head">Local branches</div>
    <div class="z-pop__item is-picked is-on" role="option"><span class="z-pop__slot"><svg class="z-ico z-ico--sm" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="z-pop__label z-mono z-ui-sm">main</span><span class="z-pop__trail">checked out</span></div>
    <div class="z-pop__item" role="option"><span class="z-pop__slot"></span><span class="z-pop__label z-mono z-ui-sm">feat/inspector</span></div>
    <div class="z-pop__item" role="option"><span class="z-pop__slot"></span><span class="z-pop__label z-mono z-ui-sm">fix/sign-in-copy</span></div>
    <div class="z-pop__sep"></div>
    <div class="z-pop__head">Worktree<span>Pick more than one to compare</span></div>
    <div class="z-pop__item is-cmd" role="menuitem">Rename</div>
  </div>
</div>
</body>
</html>
