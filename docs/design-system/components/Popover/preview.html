<!doctype html>
<html>
<head><meta charset="utf-8"><title>Popover — preview</title>
<style>
.z-pop { width: 290px; box-sizing: border-box; padding: 6px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface-3); box-shadow: var(--shadow-popover); font-family: var(--font-sans); }
.z-pop-head { padding: var(--space-1\.5) var(--space-2) var(--space-1); color: var(--fg-muted); font: 500 11px/16px var(--font-sans); }
.z-pop-opt { display: flex; align-items: flex-start; gap: var(--space-2); width: 100%; min-height: 30px; box-sizing: border-box; padding: 7px var(--space-2); border: 0; border-radius: var(--radius-sm); background: none; color: var(--fg); font: 400 13px/18px var(--font-sans); text-align: left; cursor: pointer; }
.z-pop-opt:hover, .z-pop-opt[aria-selected="true"] { background: var(--surface-hover); }
.z-pop-slot { display: flex; justify-content: center; width: 14px; flex: none; padding-top: 2px; }
.z-pop-text { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.z-pop-desc { color: var(--fg-subtle); font: 400 11px/15px var(--font-sans); }
.z-pop-check { width: 14px; height: 14px; fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.z-pop-shield { width: 12px; height: 12px; fill: none; stroke: var(--status-attention); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -1px; margin-left: 6px; }
</style>
</head>
<body>
<div class="z-stage">
  <div class="z-pop" role="listbox" aria-label="Mode">
    <div class="z-pop-head">Mode</div>
    <button type="button" class="z-pop-opt" role="option" aria-selected="true"><span class="z-pop-slot"><svg class="z-pop-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="z-pop-text">Ask before edits<span class="z-pop-desc">Asks you before it changes a file or runs a command.</span></span></button>
    <button type="button" class="z-pop-opt" role="option" aria-selected="false"><span class="z-pop-slot"></span><span class="z-pop-text">Plan<span class="z-pop-desc">Reads and plans. It changes nothing.</span></span></button>
    <button type="button" class="z-pop-opt" role="option" aria-selected="false"><span class="z-pop-slot"></span><span class="z-pop-text"><span>Accept edits<svg class="z-pop-shield" viewBox="0 0 24 24" role="img" aria-label="Lets the agent act without asking"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="M12 9v4M12 16v.01"/></svg></span><span class="z-pop-desc">Edits files without asking. Lets the agent act without asking.</span></span></button>
  </div>
</div>
</body>
</html>
