<!doctype html>
<html>
<head><meta charset="utf-8"><title>SessionRow — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&amp;display=swap">
<style>
.z-side { width: 256px; box-sizing: border-box; padding: 0 var(--space-2); background: var(--ground); font-family: var(--font-sans); }
.z-folder { display: flex; align-items: center; gap: var(--space-1\.5); height: 28px; padding: 0 var(--space-1\.5); color: var(--fg-muted); font: 500 11px/16px var(--font-sans); }
.z-folder svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.75; flex-shrink: 0; }
.z-folder__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.z-folder__count { color: var(--fg-subtle); font: 400 11px/16px var(--font-sans); }
.z-folder--folded { height: 32px; color: var(--fg-secondary); font: 400 13px/18px var(--font-sans); }
.z-folder--folded svg { color: var(--fg-subtle); }
.z-folder__sum { display: flex; align-items: center; gap: 6px; color: var(--status-attention); font: 400 11px/16px var(--font-sans); }
.z-folder__sum::before { content: ""; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--status-attention); }
.z-srow { display: flex; align-items: flex-start; gap: 10px; padding: 7px var(--space-2); border-radius: var(--radius-lg); }
.z-srow[aria-current="true"], .z-srow--hover { background: var(--surface-hover); }
.z-tile { position: relative; display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; width: 22px; height: 22px; margin-top: 1px; border-radius: var(--radius-md); background: var(--chip); box-shadow: inset 0 0 0 1px var(--border); }
.z-tile__logo { width: 14px; height: 14px; border-radius: 3px; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--border-strong); }
.z-tile__badge { position: absolute; right: -3px; bottom: -3px; width: 8px; height: 8px; border-radius: var(--radius-full); box-shadow: 0 0 0 2px var(--ground); }
.z-srow[aria-current="true"] .z-tile__badge, .z-srow--hover .z-tile__badge { box-shadow: 0 0 0 2px var(--surface-hover); }
.z-tile__badge--running { background: var(--status-running); }
.z-tile__badge--attention { background: var(--status-attention); }
.z-tile__badge--unread { background: var(--status-unread); }
.z-srow__line { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; }
.z-srow__time { flex-shrink: 0; color: var(--fg-subtle); font: 400 11px/16px var(--font-sans); }
.z-srow__text { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; }
.z-srow__title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-secondary); font: 400 13px/18px var(--font-sans); }
.z-srow[aria-current="true"] .z-srow__title { color: var(--fg); font-weight: 500; }
.z-srow__title--unread { font-weight: 500; }
.z-srow__sub { display: flex; align-items: center; gap: 4px; min-width: 0; color: var(--fg-subtle); font: 400 11px/16px var(--font-sans); white-space: nowrap; }
.z-srow[aria-current="true"] .z-srow__sub, .z-srow--hover .z-srow__sub { color: var(--fg-muted); }
.z-srow__actions { display: flex; align-self: center; gap: var(--space-0\.5); }
.z-srow__actions span { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: var(--radius-md); color: var(--fg-secondary); }
.z-srow__actions svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.z-srow__confirm { align-self: center; height: 24px; padding: 0 var(--space-2); border: 0; border-radius: 4px; background: var(--danger-surface); color: var(--danger); font: 500 12px/16px var(--font-sans); }
</style>
</head>
<body>
<div class="z-stage" style="padding:0;align-items:stretch">
  <nav class="z-side" aria-label="Sessions">
    <div class="z-folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span class="z-folder__name">agent-desktop</span><span class="z-folder__count">5</span></div>
    <div class="z-srow" aria-current="true"><span class="z-tile"><span class="z-tile__logo"></span><span class="z-tile__badge z-tile__badge--running"></span></span><span class="z-srow__text"><span class="z-srow__line"><span class="z-srow__title">Rename the app to Zorvo</span></span><span class="z-srow__sub">Claude Code · Working</span></span></div>
    <div class="z-srow z-srow--hover"><span class="z-tile"><span class="z-tile__logo"></span><span class="z-tile__badge z-tile__badge--attention"></span></span><span class="z-srow__text"><span class="z-srow__line"><span class="z-srow__title">Fix the flaky transcripts test</span></span><span class="z-srow__sub">Codex · Waiting for you</span></span><span class="z-srow__actions"><span><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span></span></div>
    <div class="z-srow"><span class="z-tile"><span class="z-tile__logo"></span><span class="z-tile__badge z-tile__badge--unread"></span></span><span class="z-srow__text"><span class="z-srow__line"><span class="z-srow__title z-srow__title--unread">Add @-mentions to the composer</span></span><span class="z-srow__sub">Qwen Code · Finished, unread</span></span></div>
    <div class="z-srow"><span class="z-tile"><span class="z-tile__logo"></span></span><span class="z-srow__text"><span class="z-srow__line"><span class="z-srow__title">Show PR checks in the top bar</span><span class="z-srow__time">2 h ago</span></span><span class="z-srow__sub">Claude Code</span></span></div>
    <div class="z-srow z-srow--hover"><span class="z-tile"><span class="z-tile__logo"></span></span><span class="z-srow__text"><span class="z-srow__line"><span class="z-srow__title">Retire the old session list</span></span><span class="z-srow__sub">Claude Code</span></span><button type="button" class="z-srow__confirm">Delete?</button></div>
    <div class="z-folder z-folder--folded"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg><span class="z-folder__name">titan-investment</span><span class="z-folder__sum">1 waiting</span></div>
  </nav>
</div>
</body>
</html>
