<!-- @dsCard group="Status" height=72 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusLine — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&amp;display=swap">
<style>
.z-dot--merged { background: var(--status-merged); }
.z-dot--danger { background: var(--danger); }
.z-status { display: inline-flex; align-items: center; gap: var(--space-1\.5); color: var(--fg-secondary); font: 400 13px/18px var(--font-sans); }
</style>
</head>
<body>
<div class="z-stage" style="gap:var(--space-4)">
  <span class="z-status"><span class="z-dot z-dot--running"></span>Working</span>
  <span class="z-status"><span class="z-dot z-dot--attention"></span>Waiting for you</span>
  <span class="z-status"><span class="z-dot z-dot--unread"></span>Finished, unread</span>
  <span class="z-status"><span class="z-dot z-dot--merged"></span>Merged</span>
  <span class="z-status"><span class="z-dot z-dot--danger"></span>Failed</span>
  <span class="z-status">2 h ago</span>
</div>
</body>
</html>
