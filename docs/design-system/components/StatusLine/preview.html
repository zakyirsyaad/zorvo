<!-- @dsCard group="Status" height=120 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusLine — preview</title></head>
<body>
<div class="z-col" style="gap:var(--space-3)">
  <div class="z-stage" style="gap:var(--space-5); padding:0">
    <span class="z-status"><span class="z-dot z-dot--running"></span>Working</span>
    <span class="z-status"><span class="z-dot z-dot--attention"></span>Waiting for you</span>
    <span class="z-status"><span class="z-dot z-dot--unread"></span>Finished, unread</span>
    <span class="z-status"><span class="z-dot z-dot--merged"></span>Merged</span>
    <span class="z-status"><span class="z-dot z-dot--danger"></span>Failed</span>
    <span class="z-status z-subtle">2 h ago</span>
  </div>
  <span class="z-status z-muted"><span class="z-dot z-dot--running z-dot--still"></span>0.8.0 · Up to date · checked 2 h ago</span>
</div>
</body>
</html>
