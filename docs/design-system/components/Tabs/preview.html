<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tabs — preview</title>
<style>
.z-tabs { display: inline-flex; gap: var(--space-0\.5); padding: var(--space-0\.5); border-radius: var(--radius-lg); background: var(--chip); }
.z-tab { display: flex; align-items: center; gap: var(--space-1\.5); padding: 0 10px; height: 26px; border: 0; border-radius: var(--radius-md); background: none; color: var(--fg-muted); font: 400 12px/16px var(--font-sans); cursor: pointer; }
.z-tab:hover { color: var(--fg); }
.z-tab[aria-selected="true"] { background: var(--surface-hover); color: var(--fg); }
.z-tab-count { color: var(--fg-muted); }
</style>
</head>
<body>
<div class="z-stage" style="display:block">
  <div class="z-tabs" role="tablist" aria-label="Inspector">
    <button type="button" class="z-tab" role="tab" aria-selected="true">Changes <span class="z-tab-count">3</span></button>
    <button type="button" class="z-tab" role="tab" aria-selected="false" tabindex="-1">Activity</button>
    <button type="button" class="z-tab" role="tab" aria-selected="false" tabindex="-1">Files</button>
    <button type="button" class="z-tab" role="tab" aria-selected="false" tabindex="-1">Terminal</button>
  </div>
</div>
</body>
</html>
