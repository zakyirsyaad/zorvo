<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast — preview</title></head>
<body>
<div class="z-col" style="align-items:flex-end; gap:10px; padding:var(--space-4)">
  <div class="z-toast" style="border-radius:var(--radius-xl); flex-direction:column; gap:var(--space-1); padding:14px var(--space-4)" role="status">
    <span class="z-fg z-w6">Zorvo 0.9.0 is ready</span>
    <span class="z-ui-sm z-muted">Restarting stops 2 agents mid-turn and 1 shell.</span>
    <span class="z-hstack" style="align-self:flex-end; margin-top:var(--space-2)"><button class="z-btn z-btn--ghost" type="button" style="color:var(--fg-secondary)">Later</button><button class="z-btn z-btn--outline" type="button" style="color:var(--fg)">Update &amp; restart</button></span>
  </div>
  <div class="z-toast z-toast--error" role="alert">
    <svg class="z-ico z-danger" viewBox="0 0 24 24" style="margin-top:2px"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
    <div class="z-grow-1" style="display:flex; flex-direction:column; gap:var(--space-2); align-items:flex-start"><span>Could not open the link. The system refused it.</span><button class="z-btn z-btn--outline z-btn--sm" type="button" style="color:var(--fg)">Try again</button></div>
    <button class="z-icon-btn z-icon-btn--xs" type="button" aria-label="Dismiss notice"><svg class="z-ico z-ico--sm" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="z-toast" role="status">
    <svg class="z-ico z-att" viewBox="0 0 24 24" style="margin-top:2px"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
    <span class="z-grow-1">Open a folder before you start a session.</span>
    <button class="z-icon-btn z-icon-btn--xs" type="button" aria-label="Dismiss notice"><svg class="z-ico z-ico--sm" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>
</body>
</html>
