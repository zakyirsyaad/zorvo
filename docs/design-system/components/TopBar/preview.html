<!doctype html>
<html>
<head><meta charset="utf-8"><title>Top bar — preview</title>
<style>
.z-bar { display: flex; align-items: center; gap: var(--space-2\.5); height: 48px; box-sizing: border-box; padding: 0 var(--space-2\.5) 0 78px; border-bottom: 1px solid var(--border); background: var(--bg); font-family: var(--font-sans); }
.z-bar__left { display: flex; flex: 1; min-width: 0; align-items: center; gap: var(--space-2); }
.z-bar__crumb { display: flex; min-width: 0; align-items: center; gap: var(--space-1\.5); font: 400 13px/18px var(--font-sans); white-space: nowrap; }
.z-bar__folder { overflow: hidden; color: var(--fg-muted); text-overflow: ellipsis; }
.z-bar__slash { color: var(--fg-subtle); }
.z-bar__title { overflow: hidden; color: var(--fg); font: 600 13px/18px var(--font-sans); white-space: nowrap; text-overflow: ellipsis; }
.z-bar__right { display: flex; align-items: center; gap: var(--space-3); }
.z-chip { display: inline-flex; align-items: center; gap: var(--space-1); height: 24px; box-sizing: border-box; padding: 0 var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--fg-secondary); font: 400 11px/16px var(--font-sans); white-space: nowrap; }
.z-chip--bar { height: 28px; padding: 0 10px; font-size: 12px; line-height: 16px; }
.z-chip--plain { border-color: transparent; color: var(--fg-muted); font-family: var(--font-mono); }
.z-chip svg, .z-icon svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.z-add { color: var(--status-running); }
.z-del { color: var(--danger); }
.z-icon { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--radius-md); color: var(--fg-muted); }
.z-icon svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="z-stage">
  <header class="z-bar">
    <div class="z-bar__left">
      <span class="z-bar__crumb"><span class="z-bar__folder">agent-desktop</span><span class="z-bar__slash" aria-hidden="true">/</span><span class="z-bar__title">Split the parser in two</span></span>
      <span class="z-chip z-chip--plain" aria-label="Branch agent/split-parser"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8"/><path d="M18 10c0 4-6 4-12 6"/></svg>agent/split-parser</span>
    </div>
    <div class="z-bar__right">
      <span class="z-chip z-chip--bar" aria-label="Plan, 2 of 4 done"><svg viewBox="0 0 24 24" style="color:var(--fg-muted)"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></svg><span style="font-family:var(--font-mono);color:var(--fg-muted)">2/4</span></span>
      <span class="z-chip z-chip--bar"><svg viewBox="0 0 24 24" style="color:var(--status-running);stroke-width:2.25"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>2 background tasks</span>
      <span class="z-chip z-chip--bar" style="font-family:var(--font-mono)"><span class="z-add">+42</span><span class="z-del">−11</span></span>
      <span class="z-icon" aria-label="Inspector"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg></span>
      <span class="z-icon" aria-label="More options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>
    </div>
  </header>
</div>
</body>
</html>
