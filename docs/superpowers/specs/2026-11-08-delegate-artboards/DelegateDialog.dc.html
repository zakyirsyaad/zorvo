<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zorvo · Delegate dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.z{--bg:#0a0a0b;--s1:#111113;--s2:#18181b;--s3:#1f1f23;--hover:#27272a;--line:#27272a;--strong:#71717a;--fg:#fafafa;--fg2:#d4d4d8;--muted:#a1a1aa;--subtle:#8b8b94;--primary:#fafafa;--onp:#09090b;--att:#fbbf24;--danger:#f87171;--overlay:rgba(0,0,0,.7);--dlg:0 24px 64px -12px rgba(0,0,0,.7);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.z.light{--bg:#fafafa;--s1:#f4f4f5;--s2:#ffffff;--s3:#ffffff;--hover:#e4e4e7;--line:#e4e4e7;--strong:#808088;--fg:#09090b;--fg2:#27272a;--muted:#52525b;--subtle:#67676f;--primary:#09090b;--onp:#fafafa;--att:#a34b08;--danger:#b91c1c;--overlay:rgba(9,9,11,.4);--dlg:0 24px 64px -12px rgba(9,9,11,.25)}
.z button{font:inherit;cursor:pointer;margin:0}
.ico{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.logo{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;background:var(--hover);color:var(--fg2);flex:none}
.row{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:6px;cursor:pointer}
.radio{width:14px;height:14px;border-radius:9999px;border:1px solid var(--strong);box-sizing:border-box;flex:none;display:flex;align-items:center;justify-content:center}
.st{margin-left:auto;font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</helmet>
<div class="{{themeClass}}" style="position: relative; width: 1024px; height: 760px; overflow: hidden; background: var(--bg); color: var(--fg); font-size: 13px; line-height: 18px;">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 96px 172px; display: flex; flex-direction: column; gap: 16px;">
    <div style="align-self: flex-end; height: 44px; width: 360px; border-radius: 12px; background: var(--s2); border: 1px solid var(--line);"></div>
    <div style="height: 18px; width: 140px; border-radius: 4px; background: var(--s2);"></div>
    <div style="height: 88px; border-radius: 8px; background: var(--s2);"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 520px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 12px; background: var(--s1); border: 1px solid var(--line); box-shadow: var(--dlg);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <h2 id="dlg-title" style="flex: 1; margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">Delegate to another agent</h2>
      <button aria-label="Close" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted);"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px;">
      <legend style="padding: 0; margin-bottom: 6px; font-weight: 500; color: var(--fg);">Agent</legend>
      <label class="row" style="background: var(--hover);"><input type="radio" name="agent" checked="checked" class="sr"><span class="radio" aria-hidden="true" style="border-color: var(--fg);"><span style="width: 6px; height: 6px; border-radius: 9999px; background: var(--fg);"></span></span><span class="logo" aria-hidden="true">X</span><span style="color: var(--fg);">Codex</span><span class="st" style="color: var(--muted);">Ready</span></label>
      <label class="row"><input type="radio" name="agent" class="sr"><span class="radio" aria-hidden="true"></span><span class="logo" aria-hidden="true">C</span><span style="color: var(--fg2);">Claude Code</span><span class="st" style="color: var(--muted);">Ready</span></label>
      <label class="row"><input type="radio" name="agent" class="sr"><span class="radio" aria-hidden="true"></span><span class="logo" aria-hidden="true">Q</span><span style="color: var(--fg2);">Qwen Code</span><span class="st" style="color: var(--subtle);">Not checked</span></label>
      <label class="row"><input type="radio" name="agent" class="sr"><span class="radio" aria-hidden="true"></span><span class="logo" aria-hidden="true">G</span><span style="color: var(--fg2);">Gemini CLI</span><span class="st" style="display: flex; align-items: center; gap: 6px; color: var(--att);"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 9999px; background: var(--att);"></span>Needs sign-in</span></label>
      <label class="row" style="opacity: .55; cursor: default;"><input type="radio" name="agent" disabled="disabled" aria-describedby="kimi-st" class="sr"><span class="radio" aria-hidden="true"></span><span class="logo" aria-hidden="true">K</span><span style="color: var(--fg2);">Kimi CLI</span><span id="kimi-st" class="st" style="color: var(--subtle);">Not installed</span></label>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="task" style="font-weight: 500; color: var(--fg);">Task</label>
      <textarea id="task" rows="3" aria-describedby="task-err task-hint" style="width: 100%; box-sizing: border-box; resize: none; padding: 8px 10px; border-radius: 8px; border: 1px solid {{taskEdge}}; background: var(--s2); color: var(--fg); font: inherit; font-size: 13px; line-height: 20px; outline: none;">{{taskText}}</textarea>
      <span id="task-err" style="display: {{errDisplay}}; font-size: 12px; color: var(--danger);">Write the task first.</span>
      <span id="task-hint" style="font-size: 12px; line-height: 17px; color: var(--subtle);">Codex reads this conversation first and works in the same folder. Each answer it gives is sent to Claude Code.<span style="display: {{notRunningDisplay}};"> Claude Code isn't running, so its reports wait in its composer.</span></span>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line);">
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--fg2);">Cancel</button>
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--primary); color: var(--onp); font-weight: 500;">Delegate</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"variant":{"editor":"enum","options":["filled","empty task","Claude Code not running"],"default":"filled"},"$preview":{"width":1024,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    const variant = this.props.variant ?? 'filled';
    const empty = variant === 'empty task';
    return {
      themeClass: light ? 'z light' : 'z',
      taskText: empty ? '' : 'Implement step 2 of the plan: token refresh in src/auth.ts, with tests.',
      taskEdge: empty ? 'var(--danger)' : 'var(--strong)',
      errDisplay: empty ? 'block' : 'none',
      notRunningDisplay: variant === 'Claude Code not running' ? 'inline' : 'none'
    };
  }
}
</script>
</body>
</html>
