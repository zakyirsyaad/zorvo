<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zorvo · Sidebar folded, archive and agents</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.z{--ground:#0a0a0b;--sheet:#111113;--s2:#18181b;--s3:#1f1f23;--hover:#27272a;--chip:rgba(255,255,255,.06);--line:#27272a;--strong:#71717a;--fg:#fafafa;--fg2:#d4d4d8;--muted:#a1a1aa;--subtle:#8b8b94;--primary:#fafafa;--onp:#09090b;--run:#34d399;--att:#fbbf24;--unread:#38bdf8;--danger:#f87171;--atts:#1f1a0d;--attb:#6b5416;--add:rgba(52,211,153,.12);--rem:rgba(248,113,113,.12);--pop:0 16px 40px -8px rgba(0,0,0,.6);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.z.light{--ground:#f4f4f5;--sheet:#fafafa;--s2:#ffffff;--s3:#ffffff;--hover:#e4e4e7;--chip:rgba(9,9,11,.05);--line:#e4e4e7;--strong:#808088;--fg:#09090b;--fg2:#27272a;--muted:#52525b;--subtle:#67676f;--primary:#09090b;--onp:#fafafa;--run:#047353;--att:#a34b08;--unread:#0369a1;--danger:#b91c1c;--atts:#fffbeb;--attb:#e9c46a;--add:rgba(4,120,87,.08);--rem:rgba(185,28,28,.08);--pop:0 12px 32px -8px rgba(9,9,11,.18)}
.z button{font:inherit;cursor:pointer;margin:0}
.z a{text-decoration:none;color:inherit}
.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.ico{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ib{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:var(--muted)}
.tile{width:22px;height:22px;flex:none;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg2)}
.tile.sm{width:16px;height:16px;border-radius:4px;font-size:9px}
.av{position:relative;display:flex;flex:none;margin-top:1px}
.badge{position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;border-radius:9999px;box-shadow:0 0 0 2px var(--ground)}
.row{display:flex;align-items:flex-start;gap:10px;padding:7px 8px;border-radius:8px}
.row.on{background:var(--hover)}
.row.on .badge{box-shadow:0 0 0 2px var(--hover)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.t1{color:var(--fg2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.t2{color:var(--subtle);font-size:11px;line-height:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tm{flex:none;color:var(--subtle);font-size:11px;line-height:18px}
.fold{display:flex;align-items:center;gap:6px;padding:12px 8px 4px;color:var(--muted);font-size:11px;font-weight:500}
.seg{height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:12px}
.seg.on{background:var(--hover);color:var(--fg)}
.chip{height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:6px;background:var(--chip);color:var(--fg2);font-size:12px}
.step{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px 0 14px;border-radius:6px;font-size:12px;color:var(--fg2)}
.step .verb{width:44px;flex:none;color:var(--muted)}
.frow{display:flex;align-items:center;gap:8px;padding:8px 10px}
@media (max-width:900px){.z .side,.z .insp{display:none}.z .stage{padding-left:8px}}
.dot{width:6px;height:6px;border-radius:9999px;flex:none}
.sb22{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:var(--muted)}
.rl{display:flex;align-items:center;gap:2px;margin:-2px -4px -2px 0}
.z .fh{width:100%;height:30px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--fg2);font-size:12px;font-weight:500;text-align:left}
.z .fh .sum{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:400}
.mi{height:28px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:6px}
.z .sg{height:22px;padding:0 8px;border:1px solid var(--strong);border-radius:6px;background:transparent;color:var(--fg);font-size:11px}
</style>
</helmet>
<div class="{{themeClass}}" style="position: relative; width: 600px; height: 800px; box-sizing: border-box; display: flex; overflow: hidden; background: var(--ground); color: var(--fg); font-size: 13px; line-height: 18px;">

  <div style="width: 264px; flex: none; display: flex; flex-direction: column;">
    <div style="height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 16px;">
      <div style="display: flex; gap: 8px;" aria-hidden="true">
        <span style="width: 12px; height: 12px; border-radius: 9999px; background: var(--hover);"></span>
        <span style="width: 12px; height: 12px; border-radius: 9999px; background: var(--hover);"></span>
        <span style="width: 12px; height: 12px; border-radius: 9999px; background: var(--hover);"></span>
      </div>
      <button class="ib" aria-label="Hide sidebar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></button>
    </div>

    <div style="flex: none; display: flex; gap: 6px; padding: 2px 12px 10px;">
      <button style="flex: 1; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--s2); color: var(--fg); font-weight: 500;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New session</button>
      <button aria-label="Search sessions" style="width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 8px; background: var(--s2); color: var(--muted);"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    </div>

    <div role="group" aria-label="Filter sessions" style="flex: none; display: flex; gap: 2px; padding: 0 12px 4px;">
      <button class="seg on" aria-pressed="true">All</button>
      <button class="seg" aria-pressed="false">Needs you<span style="color: var(--att); font-weight: 600;">1</span></button>
      <button class="seg" aria-pressed="false">Working<span style="color: var(--subtle);">2</span></button>
    </div>

    <nav aria-label="Sessions" style="flex: 1; min-height: 0; overflow: hidden; padding: 0 8px; display: flex; flex-direction: column; gap: 2px;">
      <button class="fh" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; color: var(--muted);"><path d="m9 6 6 6-6 6"></path></svg>
        <span style="flex: 1;">agent-desktop</span>
        <span class="sum" style="color: var(--att);"><span class="dot" style="background: var(--att);"></span>1 waiting</span>
      </button>
      <button class="fh" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; color: var(--muted);"><path d="m9 6 6 6-6 6"></path></svg>
        <span style="flex: 1;">zorvo-site</span>
        <span class="sum" style="color: var(--muted);"><span class="dot" style="background: var(--run);"></span>2 working</span>
      </button>
      <button class="fh" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; color: var(--muted);"><path d="m9 6 6 6-6 6"></path></svg>
        <span style="flex: 1;">nadgacha</span>
        <span class="sum" style="color: var(--subtle);">4 sessions</span>
      </button>

      <div style="flex: 1;"></div>

      <button aria-expanded="true" style="height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 500; text-align: left;">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px;"><path d="m6 9 6 6 6-6"></path></svg>Archived<span style="color: var(--subtle); font-weight: 400;">12</span>
      </button>
      <div class="row" style="background: var(--hover);">
        <span class="av"><span class="tile" aria-hidden="true">G</span></span>
        <span class="rt">
          <span class="rl">
            <a href="#" class="t1" style="flex: 1; min-width: 0; color: var(--fg);">Old onboarding copy</a>
            <button class="sb22" aria-label="Unarchive Old onboarding copy" style="color: var(--fg2);"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px;"><rect x="3" y="4" width="18" height="5" rx="1"></rect><path d="M5 9v10h14V9M12 17v-5M9.5 14.5 12 12l2.5 2.5"></path></svg></button>
          </span>
          <span class="t2" style="color: var(--muted);">Gemini CLI · Oct 28</span>
        </span>
      </div>
      <a href="#" class="row" style="margin-bottom: 8px;">
        <span class="av"><span class="tile" aria-hidden="true">X</span></span>
        <span class="rt"><span class="t1">Spike: native ACP fork</span><span class="t2">Codex</span></span>
        <span class="tm">Oct 21</span>
      </a>
    </nav>

    <div style="height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px;">
      <span aria-hidden="true" style="width: 24px; height: 24px; flex: none; border-radius: 9999px; background: var(--hover); color: var(--fg2); display: flex; align-items: center; justify-content: center;"><svg class="ico" viewBox="0 0 24 24" style="width: 12px; height: 12px;"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
      <span style="flex: 1; min-width: 0; color: var(--fg2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">Local user</span>
      <button aria-label="Agents, 1 needs sign-in" aria-expanded="true" style="position: relative; height: 28px; display: flex; align-items: center; padding: 0 6px; border: 0; border-radius: 6px; background: var(--hover);"><span style="display: flex;" aria-hidden="true"><span class="tile sm">C</span><span class="tile sm" style="margin-left: -4px;">X</span><span class="tile sm" style="margin-left: -4px;">Q</span></span><span aria-hidden="true" style="position: absolute; top: 3px; right: 2px; width: 6px; height: 6px; border-radius: 9999px; background: var(--att); box-shadow: 0 0 0 2px var(--hover);"></span></button>
      <button class="ib" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-9M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg></button>
    </div>
  </div>

  <div style="flex: 1; min-width: 0; margin: 8px 8px 8px 0; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px;"></div>

  <div role="menu" aria-label="Agents" style="position: absolute; left: 8px; bottom: 56px; width: 288px; box-sizing: border-box; display: flex; flex-direction: column; padding: 6px; border-radius: 10px; background: var(--s3); border: 1px solid var(--line); box-shadow: var(--pop);">
    <div style="padding: 4px 8px 6px; color: var(--muted); font-size: 11px;">Agents in use</div>
    <div class="mi"><span class="tile sm" aria-hidden="true">C</span><span style="flex: 1; color: var(--fg2);">Claude Code</span><span style="display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px;"><span class="dot" style="background: var(--run);"></span>Ready</span></div>
    <div class="mi"><span class="tile sm" aria-hidden="true">X</span><span style="flex: 1; color: var(--fg2);">Codex</span><span style="display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px;"><span class="dot" style="background: var(--run);"></span>Ready</span></div>
    <div class="mi" style="padding-right: 3px; background: var(--hover);"><span class="tile sm" aria-hidden="true">Q</span><span style="flex: 1; color: var(--fg);">Qwen Code</span><button class="sg">Sign in</button></div>
    <div class="mi"><span class="tile sm" aria-hidden="true">G</span><span style="flex: 1; color: var(--fg2);">Gemini CLI</span><span style="color: var(--subtle); font-size: 11px;">Not checked</span></div>
    <div style="height: 1px; margin: 6px 0; background: var(--line);"></div>
    <button role="menuitem" class="mi" style="width: 100%; border: 0; background: transparent; color: var(--fg2); text-align: left;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted);"><path d="M20 7h-9M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>Manage agents</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":600,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    return { themeClass: light ? 'z light' : 'z' };
  }
}
</script>
</body>
</html>
