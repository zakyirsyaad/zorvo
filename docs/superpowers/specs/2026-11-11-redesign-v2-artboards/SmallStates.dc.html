<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zorvo · Rename, delete, notices, image preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.z{--ground:#0a0a0b;--sheet:#111113;--s2:#18181b;--s3:#1f1f23;--hover:#27272a;--chip:rgba(255,255,255,.06);--line:#27272a;--strong:#71717a;--fg:#fafafa;--fg2:#d4d4d8;--muted:#a1a1aa;--subtle:#8b8b94;--primary:#fafafa;--onp:#09090b;--run:#34d399;--att:#fbbf24;--unread:#38bdf8;--danger:#f87171;--atts:#1f1a0d;--attb:#6b5416;--add:rgba(52,211,153,.12);--rem:rgba(248,113,113,.12);--pop:0 16px 40px -8px rgba(0,0,0,.6);--dlg:0 24px 64px -12px rgba(0,0,0,.7);--overlay:rgba(0,0,0,.7);--dangers:#2a1215;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.z.light{--ground:#f4f4f5;--sheet:#fafafa;--s2:#ffffff;--s3:#ffffff;--hover:#e4e4e7;--chip:rgba(9,9,11,.05);--line:#e4e4e7;--strong:#808088;--fg:#09090b;--fg2:#27272a;--muted:#52525b;--subtle:#67676f;--primary:#09090b;--onp:#fafafa;--run:#047353;--att:#a34b08;--unread:#0369a1;--danger:#b91c1c;--atts:#fffbeb;--attb:#e9c46a;--add:rgba(4,120,87,.08);--rem:rgba(185,28,28,.08);--pop:0 12px 32px -8px rgba(9,9,11,.18);--dlg:0 24px 64px -12px rgba(9,9,11,.25);--overlay:rgba(9,9,11,.4);--dangers:#fef2f2}
.z button{font:inherit;cursor:pointer;margin:0}
.z a{text-decoration:none;color:inherit}
.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.ico{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ib{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:var(--muted)}
.tile{width:22px;height:22px;flex:none;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg2)}
.av{position:relative;display:flex;flex:none;margin-top:1px}
.badge{position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;border-radius:9999px;box-shadow:0 0 0 2px var(--ground)}
.row{display:flex;align-items:flex-start;gap:10px;padding:7px 8px;border-radius:8px}
.row.on{background:var(--hover)}
.row.on .badge{box-shadow:0 0 0 2px var(--hover)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.t1{color:var(--fg2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.t2{color:var(--subtle);font-size:11px;line-height:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fold{display:flex;align-items:center;gap:6px;padding:12px 8px 4px;color:var(--muted);font-size:11px;font-weight:500}
.toast{display:flex;align-items:flex-start;gap:10px;width:340px;box-sizing:border-box;margin:0;padding:12px 12px 12px 14px;border-radius:10px;background:var(--s3);border:1px solid var(--line);box-shadow:var(--pop)}
.x{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:var(--muted)}
</style>
</helmet>
<div class="{{themeClass}}" style="position: relative; width: 1024px; height: 700px; box-sizing: border-box; display: flex; overflow: hidden; background: var(--ground); color: var(--fg); font-size: 13px; line-height: 18px;">

  <aside aria-label="Sidebar" style="width: 264px; flex: none; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 32px 8px 0;">
    <div class="fold"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px;"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span style="flex: 1;">agent-desktop</span><span style="color: var(--subtle); font-weight: 400;">3</span></div>

    <div class="row on">
      <span class="av"><span class="tile" aria-hidden="true">C</span></span>
      <span class="rt" style="gap: 4px;">
        <input aria-label="Rename Add GitHub connection" value="GitHub connection in Settings" style="width: 100%; height: 26px; box-sizing: border-box; padding: 0 8px; border-radius: 6px; border: 1px solid var(--fg); background: var(--ground); color: var(--fg); font: inherit; outline: none;">
        <span class="t2">Return saves, Esc cancels</span>
      </span>
    </div>

    <div class="row on">
      <span class="av"><span class="tile" aria-hidden="true">G</span></span>
      <span class="rt"><span class="t1" style="color: var(--fg); font-weight: 500;">Landing page copy</span><span class="t2" style="color: var(--muted);">Gemini CLI · Yesterday</span></span>
      <button aria-label="Confirm delete" title="Delete this session and its conversation for good" style="align-self: center; height: 24px; padding: 0 8px; border: 0; border-radius: 6px; background: var(--dangers); color: var(--danger); font-size: 12px; font-weight: 500;">Delete?</button>
    </div>

    <a href="#" class="row">
      <span class="av"><span class="tile" aria-hidden="true">C</span><span class="badge" style="background: var(--run);"></span></span>
      <span class="rt"><span class="t1">Fix transcript save interval</span><span class="t2">Claude Code · Working</span></span>
    </a>
  </aside>

  <div style="flex: 1; min-width: 0; padding: 8px 8px 8px 0;">
    <div style="position: relative; height: 100%; box-sizing: border-box; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>
      <dialog open="open" aria-modal="true" aria-label="Image preview" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; width: 520px; box-sizing: border-box; display: flex; flex-direction: column; padding: 0; border-radius: 12px; background: var(--s2); border: 1px solid var(--line); box-shadow: var(--dlg); color: var(--fg); overflow: hidden;">
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px;"><span style="flex: 1; color: var(--fg); font-weight: 500;">sidebar-before.png</span><span style="color: var(--subtle); font-size: 11px;">1280 × 800 · 214 KB</span><button class="ib" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
        <figure role="img" aria-label="Screenshot of the old sidebar" style="height: 240px; box-sizing: border-box; margin: 0 12px 12px; border-radius: 8px; background: var(--ground); border: 1px solid var(--line); display: flex; overflow: hidden;">
          <div style="width: 90px; background: var(--sheet); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; padding: 14px 10px;"><span style="height: 8px; border-radius: 3px; background: var(--hover);"></span><span style="height: 8px; border-radius: 3px; background: var(--strong);"></span><span style="height: 8px; width: 70%; border-radius: 3px; background: var(--hover);"></span><span style="height: 8px; border-radius: 3px; background: var(--hover);"></span></div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 18px;"><span style="height: 8px; width: 60%; border-radius: 3px; background: var(--hover);"></span><span style="height: 8px; width: 80%; border-radius: 3px; background: var(--line);"></span><span style="margin-top: auto; height: 40px; border-radius: 6px; background: var(--s2); border: 1px solid var(--line);"></span></div>
        </figure>
      </dialog>
    </div>
  </div>

  <div style="position: absolute; right: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 10px;">
    <section class="toast" role="status">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 2px; color: var(--att);"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>
      <span style="flex: 1; color: var(--fg2);">Another agent is signing in. Finish that first, then try again.</span>
      <button class="x" aria-label="Dismiss notice"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px;"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </section>
    <section class="toast" role="alert" style="border-color: var(--danger);">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 2px; color: var(--danger);"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 6px;"><span style="color: var(--fg);">Zorvo couldn't save your sessions.</span><button style="align-self: flex-start; height: 24px; padding: 0 8px; border: 1px solid var(--strong); border-radius: 6px; background: transparent; color: var(--fg); font-size: 12px;">Try again</button></span>
      <button class="x" aria-label="Dismiss notice"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px;"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1024,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    return { themeClass: light ? 'z light' : 'z' };
  }
}
</script>
</body>
</html>
