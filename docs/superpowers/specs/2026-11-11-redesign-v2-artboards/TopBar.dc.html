<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zorvo · Top bar states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.z{--ground:#0a0a0b;--sheet:#111113;--s2:#18181b;--s3:#1f1f23;--hover:#27272a;--chip:rgba(255,255,255,.06);--line:#27272a;--strong:#71717a;--fg:#fafafa;--fg2:#d4d4d8;--muted:#a1a1aa;--subtle:#8b8b94;--primary:#fafafa;--onp:#09090b;--run:#34d399;--att:#fbbf24;--unread:#38bdf8;--danger:#f87171;--atts:#1f1a0d;--attb:#6b5416;--add:rgba(52,211,153,.12);--rem:rgba(248,113,113,.12);--pop:0 16px 40px -8px rgba(0,0,0,.6);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.z.light{--ground:#f4f4f5;--sheet:#fafafa;--s2:#ffffff;--s3:#ffffff;--hover:#e4e4e7;--chip:rgba(9,9,11,.05);--line:#e4e4e7;--strong:#808088;--fg:#09090b;--fg2:#27272a;--muted:#52525b;--subtle:#67676f;--primary:#09090b;--onp:#fafafa;--run:#047353;--att:#a34b08;--unread:#0369a1;--danger:#b91c1c;--atts:#fffbeb;--attb:#e9c46a;--add:rgba(4,120,87,.08);--rem:rgba(185,28,28,.08);--pop:0 12px 32px -8px rgba(9,9,11,.18)}
.z button{font:inherit;cursor:pointer;margin:0}
.z a{text-decoration:none;color:inherit}
.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.ico{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ib{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:var(--muted)}
.tile{width:22px;height:22px;flex:none;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg2)}
.tile.sm{width:16px;height:16px;border-radius:4px;font-size:9px}
.av{position:relative;display:flex;flex:none;margin-top:1px}
.badge{position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;border-radius:9999px;box-shadow:0 0 0 2px var(--ground)}
.row{display:flex;align-items:flex-start;gap:10px;padding:7px 8px;border-radius:8px}
.row.on{background:var(--hover)}
.row.on .badge{box-shadow:0 0 0 2px var(--hover)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.t1{color:var(--fg2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.t2{color:var(--subtle);font-size:11px;line-height:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tm{flex:none;color:var(--subtle);font-size:11px;line-height:18px}
.fold{display:flex;align-items:center;gap:6px;padding:12px 8px 4px;color:var(--muted);font-size:11px;font-weight:500}
.seg{height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:12px}
.seg.on{background:var(--hover);color:var(--fg)}
.chip{height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:6px;background:var(--chip);color:var(--fg2);font-size:12px}
.step{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px 0 14px;border-radius:6px;font-size:12px;color:var(--fg2)}
.step .verb{width:44px;flex:none;color:var(--muted)}
.frow{display:flex;align-items:center;gap:8px;padding:8px 10px}
@media (max-width:900px){.z .side,.z .insp{display:none}.z .stage{padding-left:8px}}
.sheet{display:flex;flex-direction:column;overflow:hidden;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
.bar{position:relative;height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 18px;border-bottom:1px solid var(--line)}
.bar h1{margin:0;min-width:0;font-size:13px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.z .bc{min-width:0;height:24px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 4px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:12px;white-space:nowrap}
.z .cb{height:28px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg2);font-size:12px;white-space:nowrap}
.z .cb .num{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}
.z .mi{width:100%;height:28px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--fg2);text-align:left}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1120px; height: 510px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 32px; overflow: hidden; background: var(--ground); color: var(--fg); font-size: 13px; line-height: 18px;">

  <section class="sheet" aria-label="Top bar, basic" style="height: 88px; flex: none;">
    <header class="bar">
      <span style="color: var(--muted);">agent-desktop</span>
      <span aria-hidden="true" style="color: var(--subtle);">/</span>
      <h1>Redesign the main window</h1>
      <button class="bc" aria-label="Branch agent/redesign-main-window" style="margin-left: 6px;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px;"><circle cx="6" cy="6" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="8" r="2.5"></circle><path d="M6 8.5v7M18 10.5c0 4-6 3-11 6"></path></svg><span class="mono" style="font-size: 11px; overflow: hidden; text-overflow: ellipsis;">agent/redesign-main-window</span></button>
      <button class="bc" aria-label="Pull request 134, open"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; color: var(--run);"><circle cx="6" cy="6" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-3"></path></svg>#134 Open</button>
      <span style="flex: 1;"></span>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="ib" aria-label="Toggle inspector" style="color: var(--fg2);"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></button>
        <button class="ib" aria-label="More actions"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></button>
      </div>
    </header>
  </section>

  <section class="sheet" aria-label="Top bar, full, with the actions menu open" style="height: 200px; flex: none;">
    <header class="bar" style="z-index: 2;">
      <span style="color: var(--muted);">agent-desktop</span>
      <span aria-hidden="true" style="color: var(--subtle);">/</span>
      <h1>Redesign the main window</h1>
      <button class="bc" aria-label="Branch agent/redesign-main-window" style="margin-left: 6px;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px;"><circle cx="6" cy="6" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="8" r="2.5"></circle><path d="M6 8.5v7M18 10.5c0 4-6 3-11 6"></path></svg><span class="mono" style="font-size: 11px; overflow: hidden; text-overflow: ellipsis;">agent/redesign-main-window</span></button>
      <button class="bc" aria-label="Pull request 134, open"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; color: var(--run);"><circle cx="6" cy="6" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-3"></path></svg>#134 Open</button>
      <span style="flex: 1;"></span>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="cb"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; color: var(--muted);"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="m3 6 1 1 2-2M3 12l1 1 2-2"></path></svg>Plan<span class="num">3/7</span></button>
        <button class="cb"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; flex: none; fill: none; stroke: var(--run); stroke-width: 2.25; stroke-linecap: round;"><path d="M12 3a9 9 0 1 1-9 9"></path></svg>2 background tasks</button>
        <button class="cb mono" aria-label="42 lines added, 11 removed. Open changes"><span style="font-size: 11px; color: var(--run);">+42</span><span style="font-size: 11px; color: var(--danger);">−11</span></button>
        <button class="ib" aria-label="Toggle inspector" aria-pressed="true" style="background: var(--hover); color: var(--fg2);"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></button>
        <button class="ib" aria-label="More actions" aria-expanded="true" style="background: var(--hover); color: var(--fg2);"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></button>
      </div>
      <div role="menu" aria-label="Session actions" style="position: absolute; top: 44px; right: 8px; width: 220px; box-sizing: border-box; display: flex; flex-direction: column; padding: 6px; border-radius: 10px; background: var(--s3); border: 1px solid var(--line); box-shadow: var(--pop);">
        <button role="menuitem" class="mi"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted);"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>Open in new window</button>
        <button role="menuitem" class="mi"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted);"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Open in Finder</button>
        <button role="menuitem" class="mi"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted);"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Rename</button>
        <div style="height: 1px; margin: 6px 0; background: var(--line);"></div>
        <button role="menuitem" class="mi"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted);"><rect x="3" y="4" width="18" height="5" rx="1"></rect><path d="M5 9v10h14V9M10 13h4"></path></svg>Archive</button>
      </div>
    </header>
  </section>

  <section class="sheet" aria-label="Top bar, sidebar hidden" style="height: 88px; flex: none;">
    <header class="bar" style="padding-left: 0;">
      <div style="width: 76px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding-left: 20px;" aria-hidden="true">
        <span style="width: 12px; height: 12px; border-radius: 9999px; background: var(--hover);"></span>
        <span style="width: 12px; height: 12px; border-radius: 9999px; background: var(--hover);"></span>
        <span style="width: 12px; height: 12px; border-radius: 9999px; background: var(--hover);"></span>
      </div>
      <div style="display: flex; align-items: center;">
        <button class="ib" aria-label="Show sidebar" style="color: var(--fg2);"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></button>
        <button class="ib" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
        <button class="ib" aria-label="Forward" disabled="disabled" style="color: var(--subtle); cursor: not-allowed;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
      </div>
      <span style="color: var(--muted); margin-left: 4px;">agent-desktop</span>
      <span aria-hidden="true" style="color: var(--subtle);">/</span>
      <h1>Fix transcript save interval</h1>
      <button class="bc" aria-label="Branch main" style="margin-left: 6px;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px;"><circle cx="6" cy="6" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="8" r="2.5"></circle><path d="M6 8.5v7M18 10.5c0 4-6 3-11 6"></path></svg><span class="mono" style="font-size: 11px;">main</span></button>
      <span style="flex: 1;"></span>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="ib" aria-label="Toggle inspector" style="color: var(--fg2);"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></button>
        <button class="ib" aria-label="More actions"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></button>
      </div>
    </header>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1120,"height":510}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    return { themeClass: light ? 'z light' : 'z' };
  }
}
</script>
</body>
</html>
