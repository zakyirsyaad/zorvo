[package]
name = "zorvo"
version = "0.15.0"
description = "Every coding agent, one desktop."
authors = ["zakyirsyaad <zkyxentertain@gmail.com>"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "zorvo_lib"
# macOS only needs the rlib. Add "staticlib" and "cdylib" back before running
# `tauri ios init` or `tauri android init`: the mobile builds link those.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.1"
# The artifact page's own webview is made with wry directly, so Tauri gives it no IPC.
# Keep this at the version Tauri uses: one wry in Cargo.lock (a test checks).
wry = { version = "=0.57.2", default-features = false }
tauri-plugin-notification = "=2.8.1"
# Not the default features: `zip` only serves Windows .zip bundles and Linux AppImage, and it pins
# zip 4 (RUSTSEC-2026-0367/0368/0369, no 4.x fix), which would keep `cargo audit` red. `system-proxy`
# is kept so the update check follows the macOS proxy settings.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.23"
url = "2"
regex = "1"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"
plist = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The OS random source for the recovery code and proxy tokens; the version already in Cargo.lock.
getrandom = "=0.3.4"
# The private-session loopback proxy: a hyper server in the backend and a streaming reqwest client
# upstream. Pin the versions already in Cargo.lock. reqwest gets no TLS provider of its own; the
# proxy builds its rustls config with ring (the provider ureq already uses), so aws-lc stays out.
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
# Verifying NEAR AI's per-answer ECDSA signature (secp256k1, EIP-191).
k256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
sha3 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
ammonia = "=4.2.5"

# Draws a real artboard; its own `main` runs on the process's main thread, which Tauri's
# event loop needs and libtest never gives a test. Skips unless ZORVO_RENDER_TEST=1.
[[test]]
name = "canvas_render"
path = "tests/canvas_render.rs"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The browser's views and pictures of canvas artboards (`artifacts/render.rs`): the versions
# wry already compiles.
block2 = "=0.6.2"
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKContentWorld", "WKFrameInfo", "WKHTTPCookieStore", "WKPDFConfiguration", "WKPreferences", "WKScriptMessage", "WKScriptMessageHandler", "WKSecurityOrigin", "WKSnapshotConfiguration", "WKUIDelegate", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSGraphics", "NSImageRep", "NSImage"] }
# Keychain for the Zorvo Private device secret; the version the updater already compiles.
security-framework = "=3.7.0"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSGeometry", "NSString", "NSUserDefaults", "NSValue"] }
# Joins exported artboards into one PDF (`artifacts/render.rs::join_pdfs`), same objc2 family.
objc2-pdf-kit = { version = "=0.3.2", default-features = false, features = ["std", "PDFDocument", "PDFPage"] }

# Line numbers for our own code, no debug info for dependencies: keeps
# target/ small in every checkout and on CI. Leave `incremental` to each
# machine's ~/.cargo/config.toml.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
