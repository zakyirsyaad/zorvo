[package]
name = "zorvo"
version = "0.8.1"
description = "Every coding agent, one desktop."
authors = ["zakyirsyaad <zkyxentertain@gmail.com>"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "zorvo_lib"
# macOS only needs the rlib. Add "staticlib" and "cdylib" back before running
# `tauri ios init` or `tauri android init`: the mobile builds link those.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "=2.7.0"
# Not the default features: `zip` only serves Windows .zip bundles and Linux AppImage, and it pins
# zip 4 (RUSTSEC-2026-0367/0368/0369, no 4.x fix), which would keep `cargo audit` red. `system-proxy`
# is kept so the update check follows the macOS proxy settings.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.23"
url = "2"
regex = "1"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"
flate2 = "1"
tar = { version = "0.4", default-features = false }
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSUserDefaults", "NSValue"] }

# Line numbers for our own code, no debug info for dependencies: keeps
# target/ small in every checkout and on CI. Leave `incremental` to each
# machine's ~/.cargo/config.toml.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
